<!DOCTYPE html>
<html lang='pt-br'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>EQUIPAMENTOS DO LABORATÓRIO</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <h1>EQUIPAMENTOS DO LABORATÓRIO</h1>
    <div id="filtros">
        <p>Filtros de Pesquisa</p>
        <input type="text" id="id" placeholder="ID" value="">
        <input type="text" id="nome" placeholder="NOME" value="">
        <input type="text" id="descricao" placeholder="DESCRIÇÃO" value="">
        <select id="tipo">
            <option value="">- TIPO -</option>
            <option value="notebook">Notebook</option>
            <option value="desktop">Desktop</option>
            <option value="impressora">Impressora</option>
            <option value="projetor">Projetor</option>
            <option value="webcam">Webcam</option>
            <option value="microfone">Microfone</option>
            <option value="cabo">Cabo</option>
        </select>
        <select id="status">
            <option value="">- STATUS -</option>
            <option value="disponivel">Disponível</option>
            <option value="manutencao">Manutenção</option>
            <option value="indisponivel">Indisponível</option>
        </select>
        <button id="filtrar">FILTRAR</button>
        <button id="cadastrar">CADASTRAR</button>
        <!-- botão de salvar, depois que alterar - ai vou dar um display none -->
        <button id="salvar">SALVAR</button>
    </div>

    <!-- DIV para exibir alertas -->
    <div id="alerta"></div>

    <hr>
    <div id="equipamentos">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Tipo</th>
                    <th>Status</th>
                    <th>Descrição</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="data">

            </tbody>
        </table>
    </div>
    <script src='main.js'></script>
</body>
</html>
